<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Terminal</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main id="terminal-container">
    <div id="history"></div>
    <div class="input-line">
      <span id="prompt-path">guest@system</span><span id="prompt-symbol">:~$</span>
      <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false" />
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
